<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>OLYMPUS · samples</title>
<!--
  OLYMPUS: the samples gallery, the page the user scores the look from (tradecraft's samples/index.html,
  carried over). It lists samples/index.json (built by tools/gallery.mjs from every samples/*/sample.json):
  each sample, its groups (L1, L2, ...), each group's views as the 2 × 2 matrix its sample.json declares
  (rows and columns labelled: what differs between them), with their pictures. A picture opens large
  (the lightbox: the arrow keys flip between the views of a group and, up and down, between groups; S
  stars; Z magnifies twice where the mouse is; 1 shows the shot pixel for pixel; O opens the view live;
  Esc closes). Each view has a star (a pick) and a score out of 100, each group a note; all are kept in
  this browser (localStorage olympus.picks, olympus.scores, olympus.notes), and "Copy my picks" puts them
  on the clipboard as text to paste back into the conversation, with the stars and mean scores tallied by
  row and column (by density, by figures). Thumbnails are scaled smoothly (nearest-neighbour shrinking
  drops whole rows of pixel art); the lightbox shows the shot's own pixels, nearest-neighbour.
-->
<style>
  :root { --bg: #121317; --card: #1b1d23; --line: #2b2e36; --text: #d9dce2; --dim: #8b909b; --pick: #e7b84f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 24px; background: rgba(18, 19, 23, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; letter-spacing: 0.14em; margin: 0; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: #262932; border: 1px solid #3a3e49; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: #5a6070; }
  main { padding: 20px 24px 60px; max-width: 1560px; margin: 0 auto; }
  .sample > h2 { font-size: 17px; margin: 6px 0 2px; font-weight: 600; }
  .sample > p { margin: 0 0 16px; color: var(--dim); max-width: 1000px; }
  section.group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; margin-bottom: 18px; }
  section.group h3 { margin: 0; font-size: 16px; font-weight: 600; }
  section.group h3 .id { color: var(--pick); font-weight: 600; font-size: 14px; margin-right: 10px; font-variant-numeric: tabular-nums; }
  section.group > p { margin: 4px 0 12px; color: var(--dim); max-width: 1100px; }
  .set { margin-top: 10px; }
  .set h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--text); }
  .matrix { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 10px 14px; align-items: start; }
  .matrix .col { font-size: 12px; color: var(--dim); text-align: center; letter-spacing: 0.04em; }
  .matrix .row { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; color: var(--dim); text-align: center; align-self: center; letter-spacing: 0.04em; }
  .views { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  figure { margin: 0; position: relative; }
  figure .pic { display: block; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #0d0e11; cursor: zoom-in; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
  figure.picked .pic { border-color: var(--pick); box-shadow: 0 0 0 1px var(--pick); }
  figcaption { display: flex; align-items: center; gap: 8px; padding: 6px 2px 0; font-size: 13px; }
  figcaption .vid { font-weight: 600; font-variant-numeric: tabular-nums; }
  figcaption .name { color: var(--dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  figcaption a { color: var(--dim); font-size: 12px; text-decoration: none; }
  figcaption a:hover { color: var(--text); }
  .star { background: none; border: none; font-size: 19px; line-height: 1; padding: 0 3px; color: #555b67; }
  .star.on { color: var(--pick); }
  input.score { width: 70px; font: inherit; font-size: 13px; color: var(--text); background: #14161b; border: 1px solid #3a3e49; border-radius: 5px; padding: 2px 6px; }
  input.score:focus, textarea:focus { outline: none; border-color: var(--pick); }
  textarea.note { display: block; width: 100%; margin-top: 12px; min-height: 34px; resize: vertical; font: inherit; font-size: 13px; color: var(--text);
                  background: #14161b; border: 1px solid #3a3e49; border-radius: 6px; padding: 6px 8px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2d313b; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  .toast.show { opacity: 1; }
  #box { position: fixed; inset: 0; z-index: 4; background: #08090c; display: none; flex-direction: column; }
  #box.open { display: flex; }
  #box .stagebox { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #box img { image-rendering: pixelated; display: block; transform-origin: 50% 50%; }
  #box .bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-top: 1px solid var(--line); background: #121317; font-size: 13px; flex-wrap: wrap; }
  #box .bar .vid { font-weight: 600; color: var(--pick); }
  #box .bar .name { color: var(--text); }
  #box .bar .keys { color: var(--dim); font-size: 12px; margin-left: auto; }
  #box .bar a { color: var(--dim); font-size: 12px; text-decoration: none; }
  #box .bar a:hover { color: var(--text); }
  @media (max-width: 760px) { header, main { padding-left: 14px; padding-right: 14px; } .matrix { grid-template-columns: 1fr; } .matrix .row, .matrix .col { display: none; } }
</style>
</head>
<body>
<header>
  <h1>OLYMPUS · SAMPLES</h1>
  <span class="meta" id="built"></span>
  <span class="spacer"></span>
  <span class="meta" id="count"></span>
  <button id="copy">Copy my picks</button>
  <button id="clear">Clear</button>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<div id="box">
  <div class="stagebox" id="boxStage"><img id="boxImg" alt=""></div>
  <div class="bar">
    <span class="vid" id="boxId"></span><span class="name" id="boxName"></span>
    <button class="star" id="boxStar" title="pick (S)">★</button>
    <input class="score" id="boxScore" type="number" min="0" max="100" step="5" placeholder="score">
    <a id="boxLive" target="_blank" rel="noopener">open live</a>
    <span class="keys">← → the group's views · ↑ ↓ groups · S star · Z magnify · 1 pixel for pixel · O live · Esc close</span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  // ---------- what this browser remembers ----------
  const KEYS = { picks: 'olympus.picks', scores: 'olympus.scores', notes: 'olympus.notes' };
  const load = (k, empty) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? empty; } catch { return empty; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let picks = new Set(load(KEYS.picks, [])), scores = load(KEYS.scores, {}), notes = load(KEYS.notes, {});
  const store = () => { save(KEYS.picks, [...picks]); save(KEYS.scores, scores); save(KEYS.notes, notes); count(); };
  const toast = (t) => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); };
  const count = () => {
    const n = Object.values(scores).filter(v => v !== '' && v !== null).length;
    document.getElementById('count').textContent = [picks.size ? `${picks.size} starred` : '', n ? `${n} scored` : ''].filter(Boolean).join(' · ');
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  let index = { built: '', samples: [] };
  const all = [];                                       // every view, in page order: { key, s, g, v, fig }
  const groupsOf = [];                                  // every group: [first, last] indices into all
  const keyOf = (s, v) => `${s.id}/${v.id}`;
  const clampScore = (x) => { if (x === '' || x === null || x === undefined) return ''; const n = Math.round(Number(x)); return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : ''; };

  /** Star or un-star, score, everywhere the view shows (its card, the lightbox). */
  function setPick(key, on) { on ? picks.add(key) : picks.delete(key); store(); refresh(key); }
  function setScore(key, value) { const v = clampScore(value); if (v === '') delete scores[key]; else scores[key] = v; store(); refresh(key); }
  function refresh(key) {
    const it = all.find(a => a.key === key);
    if (it) {
      const on = picks.has(key);
      it.fig.classList.toggle('picked', on); it.fig.querySelector('.star').classList.toggle('on', on);
      const input = it.fig.querySelector('.score'); if (document.activeElement !== input) input.value = scores[key] ?? '';
    }
    if (boxAt !== null && all[boxAt]?.key === key) showBox(boxAt, true);
  }

  function figureOf(s, g, v) {
    const key = keyOf(s, v), fig = document.createElement('figure');
    const live = `${s.id}/${v.query ? '?' + v.query + '&hud=1' : '?hud=1'}`;
    fig.innerHTML = `<div class="pic"><img loading="lazy" alt="${esc(v.id)}"></div>
      <figcaption><span class="vid">${esc(v.id)}</span><span class="name" title="${esc(v.name)}">${esc(v.name)}</span>
      <a href="${esc(live)}" target="_blank" rel="noopener" title="the view live (H its overlay, Space runs time)">live</a>
      <button class="star" title="pick">★</button><input class="score" type="number" min="0" max="100" step="5" placeholder="score" title="your score out of 100"></figcaption>`;
    fig.querySelector('img').src = `${v.shot}?${encodeURIComponent(index.built || '')}`;
    const i = all.length;
    all.push({ key, s, g, v, fig, live });
    fig.querySelector('.pic').onclick = () => showBox(i);
    fig.querySelector('.star').onclick = () => setPick(key, !picks.has(key));
    const input = fig.querySelector('.score');
    input.value = scores[key] ?? '';
    input.oninput = () => setScore(key, input.value);
    if (picks.has(key)) { fig.classList.add('picked'); fig.querySelector('.star').classList.add('on'); }
    return fig;
  }

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    document.getElementById('built').textContent = index.built ? `built ${index.built.replace('T', ' ')} UTC` : '';
    if (!index.samples.length) { list.innerHTML = '<div class="empty">No samples yet: run node tools/gallery.mjs</div>'; return; }
    for (const s of index.samples) {
      const wrap = document.createElement('div');
      wrap.className = 'sample';
      wrap.innerHTML = `<h2>${esc(s.title)}</h2><p>${esc(s.about)}</p>`;
      for (const g of s.groups) {
        const sec = document.createElement('section');
        sec.className = 'group'; sec.id = g.id;
        sec.innerHTML = `<h3><span class="id">${esc(g.id)}</span>${esc(g.title)}</h3><p>${esc(g.about ?? '')}</p>`;
        const first = all.length;
        if (g.matrix) {
          const sets = g.sets ?? [null];
          sets.forEach((label, si) => {
            const set = document.createElement('div');
            set.className = 'set';
            if (label) set.innerHTML = `<h4>${esc(label)}</h4>`;
            const m = document.createElement('div');
            m.className = 'matrix';
            m.innerHTML = `<span></span>${g.matrix.cols.map(c => `<span class="col">${esc(c)}</span>`).join('')}`;
            g.matrix.rows.forEach((rl, r) => {
              const lab = document.createElement('span'); lab.className = 'row'; lab.textContent = rl; m.appendChild(lab);
              g.matrix.cols.forEach((_, c) => {
                const v = g.views.find(x => (x.set ?? 0) === si && x.row === r && x.col === c);
                m.appendChild(v ? figureOf(s, g, v) : document.createElement('span'));
              });
            });
            set.appendChild(m);
            sec.appendChild(set);
          });
        } else {
          const grid = document.createElement('div');
          grid.className = 'views';
          for (const v of g.views) grid.appendChild(figureOf(s, g, v));
          sec.appendChild(grid);
        }
        const note = document.createElement('textarea');
        note.className = 'note'; note.placeholder = `Notes on ${g.id} (what reads, what doesn't): kept with your picks`;
        const nk = `${s.id}/${g.id}`;
        note.value = notes[nk] ?? '';
        note.oninput = () => { if (note.value.trim()) notes[nk] = note.value; else delete notes[nk]; store(); };
        sec.appendChild(note);
        groupsOf.push([first, all.length - 1]);
        wrap.appendChild(sec);
      }
      list.appendChild(wrap);
    }
    count();
  }

  // ---------- the lightbox ----------
  let boxAt = null, zoomed = false, exact = false, mouse = [0.5, 0.5];
  const box = document.getElementById('box'), boxImg = document.getElementById('boxImg'), boxStage = document.getElementById('boxStage');
  function fit() {
    const it = all[boxAt]; if (!it) return;
    const [nw, nh] = it.v.native ?? [boxImg.naturalWidth / 2, boxImg.naturalHeight / 2];
    const W = boxStage.clientWidth, H = boxStage.clientHeight;
    // (fit: the window's size whatever the density, as the game fills it; 1: the shot's own pixels, 2 × 2 a picture pixel)
    const k = exact ? 2 : Math.min(W / nw, H / nh);
    boxImg.style.width = `${Math.round(nw * k)}px`; boxImg.style.height = `${Math.round(nh * k)}px`;
    boxImg.style.transformOrigin = `${mouse[0] * 100}% ${mouse[1] * 100}%`;
    boxImg.style.transform = zoomed ? 'scale(2)' : 'none';
  }
  function showBox(i, keepView = false) {
    boxAt = (i + all.length) % all.length;
    const it = all[boxAt];
    if (!keepView) { boxImg.src = it.fig.querySelector('img').src; boxImg.onload = fit; }
    document.getElementById('boxId').textContent = it.v.id;
    document.getElementById('boxName').textContent = `${it.g.title} · ${it.v.name}`;
    document.getElementById('boxStar').classList.toggle('on', picks.has(it.key));
    const sc = document.getElementById('boxScore'); if (document.activeElement !== sc) sc.value = scores[it.key] ?? '';
    document.getElementById('boxLive').href = it.live;
    box.classList.add('open');
    fit();
  }
  const closeBox = () => { box.classList.remove('open'); boxAt = null; zoomed = false; };
  document.getElementById('boxStar').onclick = () => { const it = all[boxAt]; setPick(it.key, !picks.has(it.key)); };
  document.getElementById('boxScore').oninput = (e) => setScore(all[boxAt].key, e.target.value);
  boxStage.onclick = (e) => { if (e.target === boxStage) closeBox(); };
  boxStage.onmousemove = (e) => { const r = boxImg.getBoundingClientRect(); if (!zoomed && r.width) { mouse = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height].map(v => Math.max(0, Math.min(1, v))); } };
  addEventListener('resize', fit);
  addEventListener('keydown', (e) => {
    if (boxAt === null || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape' && boxAt !== null) { e.target.blur(); } return; }
    const gi = groupsOf.findIndex(([a, b]) => boxAt >= a && boxAt <= b), [a, b] = groupsOf[gi];
    if (e.key === 'Escape') closeBox();
    else if (e.key === 'ArrowRight') showBox(boxAt === b ? a : boxAt + 1);
    else if (e.key === 'ArrowLeft') showBox(boxAt === a ? b : boxAt - 1);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const [na, nb] = groupsOf[(gi + (e.key === 'ArrowDown' ? 1 : -1) + groupsOf.length) % groupsOf.length];
      showBox(Math.min(nb, na + (boxAt - a)));
    }
    else if (e.key === 's' || e.key === 'S') document.getElementById('boxStar').click();
    else if (e.key === 'z' || e.key === 'Z') { zoomed = !zoomed; fit(); }
    else if (e.key === '1') { exact = !exact; fit(); }
    else if (e.key === 'o' || e.key === 'O') open(all[boxAt].live, '_blank', 'noopener');
    else return;
    e.preventDefault();
  });

  // ---------- the text to paste back ----------
  /** The picks as text: each starred or scored view, the tallies by row and column, the notes. */
  function picksText() {
    const lines = [`OLYMPUS samples, my picks (gallery built ${(index.built || '?').replace('T', ' ')} UTC):`];
    const chosen = all.filter(a => picks.has(a.key) || scores[a.key] !== undefined);
    if (!chosen.length && !Object.keys(notes).length) return 'No picks yet.';
    for (const a of chosen) lines.push(`${picks.has(a.key) ? '★' : '-'} ${a.v.id} · ${a.g.title} · ${a.v.name}${scores[a.key] !== undefined ? ` · ${scores[a.key]}/100` : ''}`);
    // (tallies over each matrix: by row label and by column label, the stars and the mean score)
    for (const s of index.samples) {
      if (!s.matrix) continue;
      const mine = chosen.filter(a => a.s === s && a.v.row !== undefined);
      if (!mine.length) continue;
      const tally = (axis, labels) => labels.map((label, i) => {
        const these = mine.filter(a => a.v[axis] === i), st = these.filter(a => picks.has(a.key)).length;
        const sc = these.map(a => scores[a.key]).filter(x => x !== undefined);
        return `${label}: ${st} ★${sc.length ? `, mean ${Math.round(sc.reduce((p, q) => p + q, 0) / sc.length)} over ${sc.length}` : ''}`;
      }).join('; ');
      lines.push('', `${s.title}:`, `  by row (${s.matrix.rows.join(' vs ')}): ${tally('row', s.matrix.rows)}`, `  by column (${s.matrix.cols.join(' vs ')}): ${tally('col', s.matrix.cols)}`);
    }
    const ns = Object.entries(notes).filter(([, t]) => t.trim());
    if (ns.length) { lines.push('', 'Notes:'); for (const [k, t] of ns) lines.push(`- ${k.split('/').pop()}: ${t.trim().replace(/\s*\n\s*/g, ' / ')}`); }
    return lines.join('\n');
  }
  window.__picksText = picksText;

  document.getElementById('copy').onclick = async () => {
    const text = picksText();
    try { await navigator.clipboard.writeText(text); toast('Copied: paste it in the conversation'); }
    catch { prompt('Copy this:', text); }
  };
  document.getElementById('clear').onclick = () => {
    if (!confirm('Clear every star, score and note kept in this browser?')) return;
    picks = new Set(); scores = {}; notes = {}; store();
    for (const a of all) refresh(a.key);
    document.querySelectorAll('textarea.note').forEach(t => { t.value = ''; });
  };

  fetch('index.json', { cache: 'no-store' }).then(r => r.json()).then((j) => { index = j; render(); window.__ready = true; })
    .catch(() => { document.getElementById('list').innerHTML = '<div class="empty">No samples/index.json yet: run node tools/gallery.mjs</div>'; window.__ready = true; });
</script>
</body>
</html>
